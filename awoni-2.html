<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Àwẹ̀ní</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500&display=swap');

  :root{
    --night: #14101F;
    --night-deep: #0c0916;
    --plum: #2b2044;
    --gold: #e3b579;
    --gold-soft: #cfa878;
    --cream: #f3ecdd;
    --blush: #d99a8f;
    --line: rgba(227,181,121,0.22);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--night-deep);
    overscroll-behavior: none;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    overflow: hidden;
    position: relative;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- starfield ---------- */
  .stars, .stars2 {
    position: absolute; inset: -40px;
    background: transparent;
    transition: transform 0.15s ease-out;
  }
  .stars { animation: twinkle 4s ease-in-out infinite alternate; }
  .stars2 { animation: twinkle 5.5s ease-in-out infinite alternate-reverse; opacity: 0.6; }
  @keyframes twinkle { from { opacity: 0.5; } to { opacity: 1; } }

  .glow-plum {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 500px 300px at 50% 0%, var(--plum) 0%, transparent 65%);
    pointer-events: none;
  }

  /* ---------- stage / scenes ---------- */
  .stage {
    position: relative;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.97);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .scene.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  .tap-hint {
    position: absolute;
    bottom: 34px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(243,236,221,0.4);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .tap-hint.show { opacity: 1; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:0.85;} }

  .back-btn {
    position: absolute;
    top: 18px; left: 18px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--gold-soft);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.6;
    z-index: 20;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .back-btn:active { transform: scale(0.9); opacity: 1; }

  /* ---------- scene 1: the thread ---------- */
  .phone {
    width: 100%; max-width: 340px;
    border: 1px solid var(--line);
    background: rgba(20,16,31,0.6);
    border-radius: 4px;
    padding: 20px 18px 24px;
    min-height: 260px;
  }
  .phone-head {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--gold-soft);
    margin: 0 0 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .msg {
    font-size: 13px;
    line-height: 1.5;
    color: var(--cream);
    opacity: 0;
    margin: 0 0 9px;
    transform: translateY(6px);
    max-width: 78%;
  }
  .msg.in { text-align: left; }
  .msg .time { display:block; font-size: 9.5px; color: rgba(243,236,221,0.35); margin-top: 2px; }

  /* ---------- scene 2: the wake ---------- */
  .clockmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: rgba(243,236,221,0.4);
    margin-bottom: 18px;
  }
  .moon {
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fff7e8, var(--gold) 55%, var(--gold-soft) 100%);
    box-shadow: 0 0 0px 0px rgba(227,181,121,0.0);
    animation: wake 2.2s ease-out forwards;
  }
  @keyframes wake {
    0%   { box-shadow: 0 0 0 0 rgba(227,181,121,0); transform: scale(0.7); }
    60%  { box-shadow: 0 0 55px 10px rgba(227,181,121,0.35); transform: scale(1.05); }
    100% { box-shadow: 0 0 35px 6px rgba(227,181,121,0.22); transform: scale(1); }
  }
  .cue {
    margin-top: 22px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--blush);
    opacity: 0;
    animation: fadeUp 1s ease-out 1.6s forwards;
  }
  @keyframes fadeUp { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- scene 3: the letter ---------- */
  .letter-wrap { max-width: 360px; text-align: center; }
  .letter-type {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    line-height: 1.7;
    color: var(--cream);
    min-height: 190px;
  }
  .letter-type .soft { color: var(--blush); font-style: italic; }
  .cursor {
    display: inline-block; width: 1px; height: 18px;
    background: var(--gold-soft);
    margin-left: 2px; vertical-align: middle;
    animation: blink 0.9s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- scene 4: the seal ---------- */
  .seal-wrap { text-align: center; }
  .seal-label {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(243,236,221,0.45);
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp 0.9s ease-out 0.3s forwards;
  }
  .seal {
    width: 92px; height: 92px;
    margin: 0 auto;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #f0c890, var(--gold) 60%, #a67a48 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px; letter-spacing: 0.03em;
    color: var(--night-deep);
    box-shadow: 0 10px 30px -8px rgba(227,181,121,0.5), inset 0 -4px 8px rgba(0,0,0,0.25);
    cursor: pointer;
    transform: scale(0.9);
    opacity: 0;
    animation: fadeUp 0.9s ease-out 0.7s forwards, breathe 3s ease-in-out 2s infinite;
    transition: transform 0.25s ease;
    user-select: none;
  }
  .seal:active { transform: scale(0.94); }
  @keyframes breathe { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.04); } }
  .seal.cracked {
    animation: crack 0.5s ease forwards;
  }
  @keyframes crack {
    0% { transform: scale(1); }
    40% { transform: scale(1.25) rotate(6deg); opacity: 1; }
    100% { transform: scale(0.2) rotate(20deg); opacity: 0; }
  }

  .particle {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    pointer-events: none;
  }

  /* ---------- scene 5: the finale ---------- */
  .finale { text-align: center; max-width: 340px; }
  .promise {
    padding: 15px 18px;
    border: 1px solid var(--line);
    border-left: 2px solid var(--gold);
    text-align: left;
    font-size: 13px;
    line-height: 1.6;
    color: var(--gold-soft);
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.9s ease-out 0.2s forwards;
  }
  .promise strong {
    display: block; font-size: 10.5px; letter-spacing: 0.07em;
    color: var(--cream); margin-bottom: 6px; font-weight: 500;
  }
  .love {
    margin-top: 26px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 34px;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 1s ease-out 0.8s forwards, heartbeat 2.4s ease-in-out 2s infinite;
  }
  @keyframes heartbeat { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }
  .from {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: rgba(243,236,221,0.45);
    opacity: 0;
    animation: fadeUp 1s ease-out 1.1s forwards;
  }

  @media (prefers-reduced-motion: reduce) {
    *, .scene, .moon, .seal, .love { animation: none !important; transition: none !important; }
    .scene.active { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <div class="glow-plum"></div>
  <div class="stars" id="stars1"></div>
  <div class="stars2" id="stars2"></div>

  <div class="stage" id="stage">

    <section class="scene active" data-scene="1">
      <div class="phone">
        <p class="phone-head">Nura · that night</p>
        <div id="thread"></div>
      </div>
      <div class="tap-hint" id="hint1">tap to continue</div>
    </section>

    <section class="scene" data-scene="2">
      <button class="back-btn" data-back aria-label="back">‹</button>
      <p class="clockmark">01 : 42</p>
      <div class="moon"></div>
      <p class="cue">you finally answer.</p>
      <div class="tap-hint" id="hint2">tap to continue</div>
    </section>

    <section class="scene" data-scene="3">
      <button class="back-btn" data-back aria-label="back">‹</button>
      <div class="letter-wrap">
        <div class="letter-type" id="letterType"></div>
      </div>
      <div class="tap-hint" id="hint3">tap to continue</div>
    </section>

    <section class="scene" data-scene="4">
      <button class="back-btn" data-back aria-label="back">‹</button>
      <div class="seal-wrap">
        <p class="seal-label">one thing left to open</p>
        <div class="seal" id="seal">Àwẹ̀ní</div>
      </div>
    </section>

    <section class="scene" data-scene="5">
      <button class="back-btn" data-back aria-label="back">‹</button>
      <div class="finale">
        <div class="promise">
          <strong>MY PROMISE TO YOU</strong>
          From today, I wait for my baby till she sleeps. Every night. No more line busy, no more silence you didn't ask for.
        </div>
        <p class="love">I love you.</p>
        <p class="from">— Fobes, to Mrs Sadiq</p>
      </div>
    </section>

  </div>

<script>
(function(){
  // ---- starfield ----
  function makeStars(count){
    let shadows = [];
    for(let i=0;i<count;i++){
      const x = Math.floor(Math.random()*100);
      const y = Math.floor(Math.random()*100);
      const s = Math.random() > 0.85 ? 2 : 1;
      shadows.push(`${x}vw ${y}vh 0 ${s===2?'1px':'0px'} rgba(243,236,221,${(0.3+Math.random()*0.5).toFixed(2)})`);
    }
    return shadows.join(',');
  }
  const s1 = document.getElementById('stars1');
  const s2 = document.getElementById('stars2');
  s1.style.boxShadow = makeStars(70);
  s2.style.boxShadow = makeStars(40);
  s1.style.width = '2px'; s1.style.height = '2px';
  s2.style.width = '2px'; s2.style.height = '2px';

  function parallax(x, y){
    const dx = (x/window.innerWidth - 0.5) * 10;
    const dy = (y/window.innerHeight - 0.5) * 10;
    s1.style.transform = `translate(${dx}px, ${dy}px)`;
    s2.style.transform = `translate(${dx*1.8}px, ${dy*1.8}px)`;
  }
  window.addEventListener('mousemove', e => parallax(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if(e.touches[0]) parallax(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  // ---- scene control ----
  const scenes = Array.from(document.querySelectorAll('.scene'));
  let current = 0;

  function goTo(i){
    scenes[current].classList.remove('active');
    current = i;
    scenes[current].classList.add('active');
    onEnter(current);
  }

  function onEnter(i){
    if(i === 0) runThread();
    if(i === 1) setTimeout(()=> document.getElementById('hint2').classList.add('show'), 2400);
    if(i === 2) runLetter();
    if(i === 3) armSeal();
  }

  // scene 1: message thread typing in
  function runThread(){
    const thread = document.getElementById('thread');
    thread.innerHTML = '';
    const lines = [
      {t:'Babe', time:'22:04'},
      {t:'What are you doing', time:'22:18'},
      {t:'Your number is saying line busy why?', time:'22:18'},
      {t:'Good night', time:'22:31'}
    ];
    let delay = 300;
    lines.forEach((l, idx) => {
      setTimeout(()=>{
        const p = document.createElement('p');
        p.className = 'msg in';
        p.innerHTML = l.t + '<span class="time">'+l.time+'</span>';
        thread.appendChild(p);
        requestAnimationFrame(()=>{
          p.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
          p.style.opacity = '1';
          p.style.transform = 'translateY(0)';
        });
      }, delay);
      delay += 900;
    });
    setTimeout(()=> document.getElementById('hint1').classList.add('show'), delay + 400);
  }

  // scene 3: typewriter letter
  function runLetter(){
    const el = document.getElementById('letterType');
    el.innerHTML = '';
    const segments = [
      {text: "I fell asleep mid-sentence with you, and that was unfair.", cls:''},
      {text: "\n\nYou waited. You worried. You said good night when you didn't want to. ", cls:''},
      {text: "I heard that, and I'm sorry.", cls:'soft'},
      {text: "\n\nYou held back \u2018I love you\u2019 because of me \u2014 ", cls:''},
      {text: "that's the part that stays with me most.", cls:'soft'},
    ];
    let full = [];
    segments.forEach(s => { for(const ch of s.text) full.push({ch, cls:s.cls}); });

    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    let i = 0;
    let openSpan = null, openCls = null;
    function typeNext(){
      if(i >= full.length){
        cursor.remove();
        setTimeout(()=> document.getElementById('hint3').classList.add('show'), 500);
        return;
      }
      const {ch, cls} = full[i];
      if(cls !== openCls){
        openSpan = document.createElement(cls ? 'span' : 'span');
        if(cls) openSpan.className = cls;
        el.appendChild(openSpan);
        openCls = cls;
      }
      openSpan.textContent += ch === '\n' ? '' : ch;
      if(ch === '\n' && full[i+1] && full[i+1].ch === '\n'){
        el.appendChild(document.createElement('br'));
        el.appendChild(document.createElement('br'));
      }
      el.appendChild(cursor);
      i++;
      const speed = ch === ' ' ? 20 : (Math.random()*18 + 14);
      setTimeout(typeNext, speed);
    }
    typeNext();
  }

  // scene 4: seal interaction
  function armSeal(){
    const seal = document.getElementById('seal');
    seal.classList.remove('cracked');
    seal.style.transform = '';
    seal.style.opacity = '';
    seal.onclick = () => {
      seal.classList.add('cracked');
      burst(seal);
      setTimeout(()=> goTo(4), 550);
    };
  }

  function burst(el){
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    for(let i=0;i<16;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      document.body.appendChild(p);
      const angle = (Math.PI*2/16)*i;
      const dist = 60 + Math.random()*40;
      p.style.left = cx+'px';
      p.style.top = cy+'px';
      p.style.transition = 'transform 0.7s cubic-bezier(.2,.7,.3,1), opacity 0.7s ease';
      requestAnimationFrame(()=>{
        p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        p.style.opacity = '0';
      });
      setTimeout(()=> p.remove(), 750);
    }
  }

  // tap handling per scene
  document.getElementById('hint1').parentElement.addEventListener('click', () => {
    if(current===0 && document.getElementById('hint1').classList.contains('show')) goTo(1);
  });
  document.getElementById('hint2').parentElement.addEventListener('click', () => {
    if(current===1 && document.getElementById('hint2').classList.contains('show')) goTo(2);
  });
  document.getElementById('hint3').parentElement.addEventListener('click', () => {
    if(current===2 && document.getElementById('hint3').classList.contains('show')) goTo(3);
  });

  document.querySelectorAll('[data-back]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(current > 0) goTo(current - 1);
    });
  });

  onEnter(0);
})();
</script>

</body>
</html>
